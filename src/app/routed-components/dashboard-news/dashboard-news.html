<app-dashboard>
  @if (loading()) {
    <app-loading-spinner class="z-1000" />
  }
  <div class="flex flex-col min-h-screen md:h-full md:flex-row">
    <app-calendar
      [events]="events()"
      class="w-full h-auto min-h-125 md:basis-[70%] md:h-[90vh] shrink-0"
      [(selectedCardId)]="selectedCardId"
      [activityAreas]="activityAreas()"
      [(selectedAreas)]="selectedAreas"
    />
    <app-publications
      class="w-full h-auto md:basis-[30%] md:h-screen"
      [events]="events()"
      [(selectedCardId)]="selectedCardId"
    />
  </div>
</app-dashboard>
