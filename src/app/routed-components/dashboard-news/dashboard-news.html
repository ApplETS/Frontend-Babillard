<app-dashboard>
  @if ((events | async) === null) {
    <app-loading-spinner class="z-1000"/>
  }
  <div class="flex flex-row h-full">
    <app-calendar [events]="events | async" class="basis-[70%] h-[90vh]"></app-calendar>
    <app-publications class="basis-[30%]" [events]="(events | async)" [(selectedCardId)]="selectedCardId"></app-publications>
  </div>
</app-dashboard>
