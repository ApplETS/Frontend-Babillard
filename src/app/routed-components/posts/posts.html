<div class="p-7 flex flex-col gap-3">
  <div class="flex flex-row gap-4">
    <h2 transloco="post.title" class="content-center text-xl">a</h2>
    <span class="flex-1"></span>
    <button
      transloco="post.create-new-post"
      class="btn btn-primary"
      command="show-dialog"
      (click)="createNewPost()"
    >
      a
    </button>
  </div>
  <form class="flex flex-row gap-4 bg-base-200 py-2 px-4" [formRoot]="searchEventForm">
    <input type="text" transloco="post.search" class="border-2 flex-2" [formField]="searchEventForm.title" />
    <app-drop-down-select [title]="'post.filter' | transloco" class="flex-1 flex justify-end" [options]="[]" />
  </form>
  
  @if (searchEventForm().submitting()) {
    <app-loading-spinner />
  } @else {
    <app-event-table [events]="paginatedEvents().data" />
    <app-pagination class="bg-base-200 px-4" [paginationResponse]="paginatedEvents()" [formField]="searchEventForm.pagination" />
  }
</div>


<app-modal (closed)="resetModal()">
  @if (createPost()) {
    <app-post-details class="w-full" [(modalMode)]="modalMode" (closed)="resetModal()" />
  }
</app-modal>
