<div class="p-7">
  <h2 transloco="post.title"></h2>
  <div class="flex flex-row gap-4">
    <input type="text" transloco="post.search" class="border-2 flex-2" />
    <app-drop-down-select [title]="'post.filter'" class="flex-1" [options]="[]"></app-drop-down-select>
    <span class="flex-1"></span>
    <button transloco="post.create-new-post" class="flex-1 btn btn-primary" command="show-dialog" (click)="modal.showModal()"></button>
  </div>
</div>

<app-modal #modal>
  <p>Exemple</p>
    @if (createPost()) {
      <app-post-details [(modalMode)]="modalMode" />
    }
</app-modal>
