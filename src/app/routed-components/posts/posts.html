<div class="p-7 flex flex-col gap-3">
  <div class="flex flex-row gap-4">
    <h2 transloco="post.title" class="content-center text-xl">a</h2>
    <span class="flex-1"></span>
    <button
      transloco="post.create-new-post"
      class="btn btn-primary"
      command="show-dialog"
      (click)="createNewPost()"
    >
      a
    </button>
  </div>
  <form class="flex flex-row gap-4 bg-base-200 py-2 px-4" [formRoot]="searchEventForm">
    <label for="search-title">
      <span transloco="post.search"></span>
      <app-search
        inputId="search-title"
        class="flex-1"
        [formField]="searchEventForm.title"
        [placeholder]="'post.search-placeholder' | transloco"
      />
    </label>
    <div class="flex flex-row flex-2 gap-4 justify-evenly">
      <label>
        <span transloco="pagination.orderBy">a</span>
        <select
          class="select select-secondary font-semibold"
          [formField]="searchEventForm.pagination.orderBy"
        >
          @for (keyOption of eventKeys; track keyOption.key) {
            <option
              [value]="keyOption.key"
              [selected]="searchEventForm().value().pagination.orderBy === keyOption.key"
            >
              {{ keyOption.label | transloco }}
            </option>
          }
        </select>
      </label>
      <label for="order-select">
        <span transloco="pagination.order-type">a</span>
        <app-boolean-select
          inputId="order-select"
          [trueLabel]="'pagination.order-desc' | transloco"
          [falseLabel]="'pagination.order-asc' | transloco"
          [formField]="searchEventForm.pagination.descending"
        />
      </label>
    </div>
    <label>
      <span transloco="post.filter"></span>
      <select [formField]="searchEventForm.state" class="select select-secondary font-semibold">
        @for (item of statuses; track $index) {
          <option transloco="post.filters.{{ item.label }}" [value]="item.value"></option>
        }
      </select>
    </label>
  </form>

  @if (searchEventForm().submitting()) {
    <app-loading-spinner />
  } @else {
    <app-event-table [events]="paginatedEvents().data" (eventSelected)="selectEvent($event)" />
    <app-pagination
      class="bg-base-200 px-4"
      [paginationResponse]="paginatedEvents()"
      [formField]="searchEventForm.pagination"
    />
  }
</div>

<app-modal (closed)="resetModal()">
  @if (modalMode() !== ModalMode.default) {
    <app-post-details class="w-full"  [(modalMode)]="modalMode" (closed)="resetModal()" [event]="selectedEvent()" />
  }
</app-modal>
