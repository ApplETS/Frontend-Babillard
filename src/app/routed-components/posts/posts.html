<div class="p-7">
  <h2 transloco="post.title">a</h2>
  <div class="flex flex-row gap-4">
    <span class="flex-1"></span>
    <button
      transloco="post.create-new-post"
      class="btn btn-primary"
      command="show-dialog"
      (click)="createNewPost()"
    >
      a
    </button>
  </div>
  <form class="flex flex-row gap-4" [formRoot]="searchEventForm">
    <input type="text" transloco="post.search" class="border-2 flex-2" [formField]="searchEventForm.title" />
    <app-drop-down-select [title]="'post.filter'" class="flex-1 flex justify-end" [options]="[]" />
    <button type="submit" class="btn btn-ghost">Rafraîchir</button>
  </form>
  
  @if (searchEventForm().submitting()) {
    <app-loading-spinner />
  } @else {
    <app-event-table [events]="paginatedEvents().data" />
    <app-pagination [paginationResponse]="paginatedEvents()" [formField]="searchEventForm.pagination" (change)="searchEvents()" />
  }
</div>


<app-modal (closed)="resetModal()">
  @if (createPost()) {
    <app-post-details class="w-full" [(modalMode)]="modalMode" (closed)="resetModal()" />
  }
</app-modal>
