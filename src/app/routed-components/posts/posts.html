<div class="p-7">
  <h2 transloco="post.title">a</h2>
  <div class="flex flex-row gap-4">
    <input type="text" transloco="post.search" class="border-2 flex-2" />
    <app-drop-down-select [title]="'post.filter'" class="flex-1" [options]="[]" />
    <span class="flex-1"></span>
    <button
      transloco="post.create-new-post"
      class="flex-1 btn btn-primary"
      command="show-dialog"
      (click)="createNewPost()"
    >
      a
    </button>
  </div>
</div>
