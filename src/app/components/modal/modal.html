<dialog class="modal" #modal (close)="closed.emit()" (cancel)="closed.emit()">
	<div class="modal-box w-[85rem] h-[50rem] flex justify-center items-center max-w-full">
		<ng-content />
	</div>
	<form method="dialog" class="modal-backdrop">
		<button class="cursor-default">Close</button>
	</form>
</dialog>
