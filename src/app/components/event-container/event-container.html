<div class="relative">
  <p class="text-black text-center p-1" (click)="expandView()" [class.cursor-pointer]="event.extendedProps.showMore">{{ event.title }}</p>
  
  @if (expandViewExtra()) {
  <div class="fixed z-100 flex justify-center items-center">
    <div class="flex justify-between shadow-sm gap-2">
      <div class="left-div bg-base-200 border p-2 rounded-lg">
        <div class="flex justify-between items-center p-1">
          <p class="m-0 text-base text-base-content">{{ extraDate }}</p>
          <button type="button" class="cursor-pointer text-black" (click)="hideExpandedView()">
            <fa-icon [icon]="xmarkIcon" />
          </button>
        </div>
        <div class="divider my-0"></div>
        <ul class="flex flex-col gap-2">
          @for (evenement of event.extendedProps.extraEvents; track evenement.id) {
            <div class="cursor-pointer rounded-sm text-black p-1 w-72 overflow-hidden"><span class="truncate">
              {{ evenement.title }}
            </span></div>
          }
        </ul>
      </div>
    </div>
  </div>
}
</div>
