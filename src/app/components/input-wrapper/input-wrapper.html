<div class="flex flex-col gap-1 mb-4">
  <label class="text-sm font-bold" [for]="inputId">
    {{ translationKey() | transloco }}
    @if (fieldState().required()) {
      <span class="text-error">*</span>
    }
    <div
      class="input-wrapper-field mt-1"
      [class.disabled]="fieldState().disabled()"
      [class.invalid]="errorList().length > 0"
    >
      <ng-content>
        <!-- Default input used when no custom template is projected -->
        <input [id]="inputId" class="input" [type]="inputType()" [formField]="inputField()" />
      </ng-content>
    </div>
  </label>

  <!-- Error list in red -->
  @if (errorList().length > 0) {
    <ul class="flex flex-col gap-0.5 mt-1" role="alert">
      @for (error of errorList(); track $index) {
        <li class="text-xs font-bold text-error">
          {{ error.key | transloco: error.params }}
        </li>
      }
    </ul>
  }
</div>
