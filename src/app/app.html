<main class="main">
  <div class="flex items-center justify-center min-h-screen">
    <app-lang-switcher/>
    <app-theme-switcher/>
     <h1 class="text-2xl">{{'localeLayout.title' | transloco}}, {{ title() }}</h1>

    <button (click)="login()">Tester la connexion Authentik</button>
    @if (userData | async; as user) {
      <div>
        <h3>Connecté en tant que : {{ user.userData?.preferred_username }}</h3>
        <button (click)="logout()">Déconnexion</button>
      </div>
    }
    <button (click)="getData()">Get Data </button>
  </div>
</main>
<router-outlet />
